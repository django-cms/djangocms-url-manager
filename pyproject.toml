[tool.ruff]
line-length = 120
extend-exclude = [
  "**/migrations/**",
  ".env",
  "data",
  "tmp",
  "venv",
]

[tool.ruff.lint]
select = [
  "E",
  "W",
  "F",
  "I",
]

[tool.ruff.lint.isort]
combine-as-imports = true
known-first-party = ["djangocms_url_manager"]
lines-after-imports = 2
section-order = [
  "future",
  "standard-library",
  "django",
  "cms",
  "third-party",
  "first-party",
  "local-folder",
]

[tool.ruff.lint.isort.sections]
django = ["django"]
cms = ["cms", "menus"]
